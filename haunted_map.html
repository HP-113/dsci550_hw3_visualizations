<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Haunted Places - City Bubble Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            pointer-events: none;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h2>Haunted Places - City Bubble Map</h2>
    <p>Each circle represents a city with haunted places. You can zoom or drag the map.</p>

    <svg width="960" height="600"></svg>
    <div class="tooltip" style="opacity:0;"></div>

    <script>
        const svg = d3.select("svg");
        const tooltip = d3.select(".tooltip");
        const width = +svg.attr("width");
        const height = +svg.attr("height");

        const projection = d3.geoAlbersUsa()
            .scale(1300)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath(projection);
        const g = svg.append("g");

        svg.call(
            d3.zoom()
                .scaleExtent([1, 8])
                .on("zoom", (event) => {
                    g.attr("transform", event.transform);
                })
        );

        Promise.all([
            d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"),
            d3.json("haunted_map_data.json")
        ]).then(([us, cities]) => {
            g.append("g")
                .selectAll("path")
                .data(topojson.feature(us, us.objects.states).features)
                .join("path")
                .attr("fill", "#eee")
                .attr("stroke", "#999")
                .attr("d", path);

            g.append("g")
                .selectAll("circle")
                .data(cities)
                .join("circle")
                .attr("cx", d => {
                    const coords = projection([+d.longitude, +d.latitude]);
                    return coords ? coords[0] : -100;
                })
                .attr("cy", d => {
                    const coords = projection([+d.longitude, +d.latitude]);
                    return coords ? coords[1] : -100;
                })
                .attr("r", d => Math.sqrt(d.count) * 2)
                .attr("fill", "red")
                .attr("opacity", 0.7)
                .on("mouseover", (event, d) => {
                    tooltip
                        .style("opacity", 1)
                        .html(`<strong>${d.city}</strong>`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", () => {
                    tooltip.style("opacity", 0);
                });
        });
    </script>
</body>

</html>
