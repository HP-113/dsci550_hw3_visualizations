<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Haunted Places - City Bubble Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson@3"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-image: url('faceless.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center;
      color: white;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      margin: 40px auto;
      padding: 20px;
      max-width: 1000px;
      border-radius: 10px;
    }

    svg {
      display: block;
      margin: 0 auto;
      background-color: transparent;
    }

    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      pointer-events: none;
      font-size: 12px;
    }

    .state-label {
      font-size: 10px;
      fill: #333;
      text-anchor: middle;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="overlay">
    <h2>Haunted Places - City Bubble Map</h2>
    <p>Each circle represents a city with haunted places. You can zoom or drag the map.</p>
    <svg width="960" height="600"></svg>
    <div class="tooltip" style="opacity:0;"></div>
  </div>

  <script>
    const svg = d3.select("svg");
    const tooltip = d3.select(".tooltip");
    const width = +svg.attr("width");
    const height = +svg.attr("height");

    const projection = d3.geoAlbersUsa()
      .scale(1300)
      .translate([width / 2, height / 2]);

    const path = d3.geoPath(projection);
    const g = svg.append("g");

    svg.call(
      d3.zoom()
        .scaleExtent([1, 8])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
        })
    );

    const stateAbbr = {
      "01": "AL", "02": "AK", "04": "AZ", "05": "AR", "06": "CA", "08": "CO", "09": "CT", "10": "DE", "11": "DC",
      "12": "FL", "13": "GA", "15": "HI", "16": "ID", "17": "IL", "18": "IN", "19": "IA", "20": "KS", "21": "KY",
      "22": "LA", "23": "ME", "24": "MD", "25": "MA", "26": "MI", "27": "MN", "28": "MS", "29": "MO", "30": "MT",
      "31": "NE", "32": "NV", "33": "NH", "34": "NJ", "35": "NM", "36": "NY", "37": "NC", "38": "ND", "39": "OH",
      "40": "OK", "41": "OR", "42": "PA", "44": "RI", "45": "SC", "46": "SD", "47": "TN", "48": "TX", "49": "UT",
      "50": "VT", "51": "VA", "53": "WA", "54": "WV", "55": "WI", "56": "WY"
    };

    Promise.all([
      d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"),
      d3.json("haunted_map_data.json")
    ]).then(([us, cities]) => {
      const states = topojson.feature(us, us.objects.states).features;

      g.append("g")
        .selectAll("path")
        .data(states)
        .join("path")
        .attr("fill", "#eee")
        .attr("stroke", "#999")
        .attr("d", path);

      // Add state abbreviation labels
      g.append("g")
        .selectAll("text")
        .data(states)
        .join("text")
        .attr("class", "state-label")
        .attr("transform", d => {
          const centroid = path.centroid(d);
          return `translate(${centroid})`;
        })
        .text(d => stateAbbr[d.id]);

      // Draw blue city bubbles
      g.append("g")
        .selectAll("circle")
        .data(cities)
        .join("circle")
        .attr("cx", d => {
          const coords = projection([+d.longitude, +d.latitude]);
          return coords ? coords[0] : -100;
        })
        .attr("cy", d => {
          const coords = projection([+d.longitude, +d.latitude]);
          return coords ? coords[1] : -100;
        })
        .attr("r", d => Math.sqrt(d.count) * 2)
        .attr("fill", "steelblue")
        .attr("opacity", 0.7)
        .on("mouseover", (event, d) => {
          tooltip
            .style("opacity", 1)
            .html(`<strong>${d.city}</strong>`)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 28) + "px");
        })
        .on("mouseout", () => {
          tooltip.style("opacity", 0);
        });
    });
  </script>
</body>

</html>
