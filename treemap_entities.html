<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Haunted Places - Entity Treemap</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 20px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .node {
      position: absolute;
      box-sizing: border-box;
      border: 1px solid white;
      font-size: 12px;
      padding: 2px;
      overflow: hidden;
      color: white;
      text-shadow: 1px 1px 2px #000;
    }

    #treemap {
      position: relative;
      width: 960px;
      height: 600px;
    }
  </style>
</head>

<body>
  <h2>Top Haunted Entities Treemap</h2>
  <p>This treemap visualizes the most frequently mentioned entities in haunted place data (e.g., names, places, time
    expressions).</p>

  <div id="treemap"></div>

  <script>
    const width = 960;
    const height = 600;

    
    const treemap = data => {
      const root = d3.hierarchy(data)
        .sum(d => d.value)
        .sort((a, b) => b.value - a.value);

      return d3.treemap()
        .size([width, height])
        .padding(1)
        (root);
    };

    
    d3.json("treemap_entities_data.json").then(data => {

      const root = treemap(data);

      const container = d3.select("#treemap");

      const node = container.selectAll(".node")
        .data(root.leaves())
        .enter().append("div")
        .attr("class", "node")
        .style("left", d => `${d.x0}px`)
        .style("top", d => `${d.y0}px`)
        .style("width", d => `${d.x1 - d.x0}px`)
        .style("height", d => `${d.y1 - d.y0}px`)
        .style("background", d => d3.interpolateRdYlGn(d.value / root.value))
        .text(d => `${d.data.name} (${d.data.value})`);
    });
  </script>
</body>

</html>
